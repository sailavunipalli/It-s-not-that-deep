<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>It's Not That Deep — Edit Fly</title>
  <link rel="stylesheet" href="styles.css?v=4" />
</head>
<body>

  <nav class="site-nav">
    <a href="index.html" class="site-logo">INTD</a>
    <div class="site-nav-links">
      <a href="index.html">Home</a>
      <a href="feed.html">Feed</a>
      <a href="profile.html">Profile</a>
    </div>
  </nav>

  <h1>Edit Fly</h1>

  <p id="progress-status"></p>

  <form id="edit-form">
    <label for="claim-text">Claim</label>
    <textarea id="claim-text" rows="3" required></textarea>

    <label for="description-text">Description</label>
    <textarea id="description-text" rows="4" required></textarea>

    <label for="evidence-text">Evidence (links, sources, notes)</label>
    <textarea id="evidence-text" rows="3"></textarea>

    <label>Current Evidence Photo</label>
    <div id="current-image"></div>

    <label>Replace Evidence Photo (optional)</label>
    <div class="dropzone" id="claim-image-dropzone">
      <div class="dropzone-icon">📎</div>
      <div class="dropzone-text">Drag a photo here, or click to browse</div>
      <div class="dropzone-subtext">Any image format, including iPhone photos</div>
    </div>
    <p class="dropzone-status" id="claim-image-status" style="display: none"></p>
    <div id="claim-image-preview"></div>
    <input type="file" id="claim-image" accept="image/*,.heic,.heif" style="display: none" />

    <label>Additional Photos (up to 5 total)</label>
    <div id="existing-images"></div>
    <div id="pending-images"></div>
    <div class="dropzone" id="new-images-dropzone">
      <div class="dropzone-icon">🖼️</div>
      <div class="dropzone-text">Drag photos here, or click to browse</div>
      <div class="dropzone-subtext">Any image format, including iPhone photos</div>
    </div>
    <p class="dropzone-status" id="new-images-status" style="display: none"></p>
    <input type="file" id="new-images" accept="image/*,.heic,.heif" multiple style="display: none" />
    <p id="image-limit-error" class="error-text" style="display: none"></p>

    <label for="full-story-text">Full Story</label>
    <textarea id="full-story-text" rows="5"></textarea>

    <label for="conclusion-text">Conclusion</label>
    <textarea id="conclusion-text" rows="3"></textarea>

    <label for="impact-text">Impact — how this makes things better</label>
    <textarea id="impact-text" rows="3"></textarea>

    <button type="submit" id="save-btn">Save Changes</button>
    <button type="button" id="publish-btn">Publish Fly</button>
    <button type="button" id="unpublish-btn" style="display: none">Unpublish</button>
  </form>

  <p id="output"></p>

  <script src="https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = "https://uydfxwnppzglcrxkaxlf.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InV5ZGZ4d25wcHpnbGNyeGtheGxmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAyMjQxNjgsImV4cCI6MjEwNTgwMDE2OH0.zCRirCvgtB18lFgB0Q48eLSIbKTJvfaJlx-WIhrYNJI";
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function processFileForUpload(file) {
      const isHeic = file.type === "image/heic" || file.type === "image/heif" || /\.(heic|heif)$/i.test(file.name);
      if (!isHeic) return file;
      const convertedBlob = await heic2any({ blob: file, toType: "image/jpeg", quality: 0.85 });
      const newName = file.name.replace(/\.(heic|heif)$/i, ".jpg");
      return new File([convertedBlob], newName, { type: "image/jpeg" });
    }

    function setupDropzone(dropzoneEl, fileInputEl, statusEl, onFilesReady) {
      dropzoneEl.addEventListener("click", () => fileInputEl.click());
      dropzoneEl.addEventListener("dragover", (e) => { e.preventDefault(); dropzoneEl.classList.add("dragover"); });
      dropzoneEl.addEventListener("dragleave", () => dropzoneEl.classList.remove("dragover"));
      dropzoneEl.addEventListener("drop", async (e) => {
        e.preventDefault();
        dropzoneEl.classList.remove("dragover");
        const files = Array.from(e.dataTransfer.files).filter(f => f.type.startsWith("image/") || /\.(heic|heif)$/i.test(f.name));
        if (files.length) await handleFiles(files);
      });
      fileInputEl.addEventListener("change", async () => {
        const files = Array.from(fileInputEl.files);
        if (files.length) await handleFiles(files);
      });
      async function handleFiles(files) {
        statusEl.textContent = "Processing image" + (files.length > 1 ? "s" : "") + "...";
        statusEl.style.display = "block";
        try {
          const processed = [];
          for (const file of files) processed.push(await processFileForUpload(file));
          statusEl.style.display = "none";
          onFilesReady(processed);
        } catch (err) {
          statusEl.textContent = "Couldn't process one of the images. Try a different file.";
          console.error("Image processing error:", err);
        }
      }
    }

    const params = new URLSearchParams(window.location.search);
    const flyId = params.get("id");

    const form = document.getElementById("edit-form");
    const claimText = document.getElementById("claim-text");
    const descriptionText = document.getElementById("description-text");
    const evidenceText = document.getElementById("evidence-text");
    const fullStoryText = document.getElementById("full-story-text");
    const conclusionText = document.getElementById("conclusion-text");
    const impactText = document.getElementById("impact-text");
    const output = document.getElementById("output");
    const existingImagesDiv = document.getElementById("existing-images");
    const pendingImagesDiv = document.getElementById("pending-images");
    const claimImagePreview = document.getElementById("claim-image-preview");
    const imageLimitError = document.getElementById("image-limit-error");
    const progressStatus = document.getElementById("progress-status");
    const saveBtn = document.getElementById("save-btn");
    const publishBtn = document.getElementById("publish-btn");
    const unpublishBtn = document.getElementById("unpublish-btn");

    let pendingClaimImage = null;
    let pendingNewImages = [];
    let currentImagePath = null;
    let currentUserId = null;
    let currentImageUrls = [];
    let currentPublished = false;
    let isDirty = false;

    const allFields = [claimText, descriptionText, evidenceText, fullStoryText, conclusionText, impactText];
    allFields.forEach(el => el.addEventListener("input", () => { isDirty = true; updateProgress(); }));

    function updateProgress() {
      const filledCount = allFields.filter(el => el.value.trim().length > 0).length;
      progressStatus.textContent = `${filledCount}/6 sections complete`;
      publishBtn.disabled = filledCount < 6 && !currentPublished;
    }

    window.addEventListener("beforeunload", (e) => {
      if (isDirty) { e.preventDefault(); e.returnValue = ""; }
    });

    setupDropzone(
      document.getElementById("claim-image-dropzone"),
      document.getElementById("claim-image"),
      document.getElementById("claim-image-status"),
      (files) => {
        pendingClaimImage = files[0];
        isDirty = true;
        claimImagePreview.innerHTML = pendingClaimImage
          ? `<img src="${URL.createObjectURL(pendingClaimImage)}" class="fly-thumbnail" alt="New photo preview" />`
          : "";
      }
    );

    setupDropzone(
      document.getElementById("new-images-dropzone"),
      document.getElementById("new-images"),
      document.getElementById("new-images-status"),
      (files) => {
        imageLimitError.style.display = "none";
        const allowed = 5 - currentImageUrls.length - pendingNewImages.length;
        if (files.length > allowed) {
          imageLimitError.textContent = `You can add up to ${allowed} more photo(s) — you already have ${currentImageUrls.length + pendingNewImages.length}/5.`;
          imageLimitError.style.display = "block";
          return;
        }
        pendingNewImages = pendingNewImages.concat(files);
        isDirty = true;
        renderPendingImages();
      }
    );

    function renderExistingImages() {
      existingImagesDiv.innerHTML = "";
      currentImageUrls.forEach((url, index) => {
        const wrapper = document.createElement("div");
        wrapper.className = "image-thumb-wrapper";
        wrapper.innerHTML = `<img src="${url}" alt="Fly image" /><button type="button" class="remove-image-btn" data-index="${index}">×</button>`;
        existingImagesDiv.appendChild(wrapper);
      });
    }

    function renderPendingImages() {
      pendingImagesDiv.innerHTML = "";
      pendingNewImages.forEach((file, index) => {
        const wrapper = document.createElement("div");
        wrapper.className = "image-thumb-wrapper";
        wrapper.innerHTML = `<img src="${URL.createObjectURL(file)}" alt="Pending image" /><button type="button" class="remove-pending-btn" data-index="${index}">×</button>`;
        pendingImagesDiv.appendChild(wrapper);
      });
    }

    pendingImagesDiv.addEventListener("click", (e) => {
      if (e.target.classList.contains("remove-pending-btn")) {
        const index = parseInt(e.target.dataset.index, 10);
        pendingNewImages.splice(index, 1);
        renderPendingImages();
      }
    });

    existingImagesDiv.addEventListener("click", async (e) => {
      if (e.target.classList.contains("remove-image-btn")) {
        const index = parseInt(e.target.dataset.index, 10);
        const urlToRemove = currentImageUrls[index];
        const path = urlToRemove.split("/fly-images/")[1];
        if (path) await supabaseClient.storage.from("fly-images").remove([path]);
        currentImageUrls.splice(index, 1);
        const { error } = await supabaseClient.from("flies").update({ image_urls: currentImageUrls }).eq("id", flyId);
        if (error) output.textContent = "Error removing image: " + error.message;
        renderExistingImages();
      }
    });

    async function loadFly() {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (!session) { window.location.href = "index.html"; return; }
      currentUserId = session.user.id;

      if (!flyId) { output.textContent = "No Fly ID provided."; return; }

      output.textContent = "Loading Fly...";

      const { data, error } = await supabaseClient
        .from("flies")
        .select("claim, description, evidence, full_story, conclusion, impact, evidence_image_path, image_urls, published")
        .eq("id", flyId)
        .single();

      if (error) { output.textContent = "Error loading Fly: " + error.message; return; }

      claimText.value = data.claim;
      descriptionText.value = data.description;
      evidenceText.value = data.evidence || "";
      fullStoryText.value = data.full_story || "";
      conclusionText.value = data.conclusion || "";
      impactText.value = data.impact || "";
      currentImagePath = data.evidence_image_path || null;
      currentImageUrls = data.image_urls || [];
      currentPublished = data.published || false;

      renderExistingImages();
      updateProgress();
      unpublishBtn.style.display = currentPublished ? "inline-block" : "none";
      publishBtn.style.display = currentPublished ? "none" : "inline-block";

      if (currentImagePath) {
        const { data: signedData } = await supabaseClient.storage.from("evidence").createSignedUrl(currentImagePath, 3600);
        if (signedData) document.getElementById("current-image").innerHTML = `<img src="${signedData.signedUrl}" class="fly-thumbnail" alt="Evidence photo" />`;
      } else {
        document.getElementById("current-image").textContent = "No photo attached.";
      }

      output.textContent = "";
      isDirty = false;
    }

    publishBtn.addEventListener("click", async () => {
      const filledCount = allFields.filter(el => el.value.trim().length > 0).length;
      if (filledCount < 6) { output.textContent = "Fill in all six sections before publishing."; return; }

      publishBtn.disabled = true;
      publishBtn.textContent = "Publishing...";
      const { error } = await supabaseClient.from("flies").update({ published: true }).eq("id", flyId);
      publishBtn.textContent = "Publish Fly";

      if (error) {
        output.textContent = "Error publishing: " + error.message;
        publishBtn.disabled = false;
      } else {
        output.textContent = "Published! This Fly is now visible on the public Feed.";
        currentPublished = true;
        unpublishBtn.style.display = "inline-block";
        publishBtn.style.display = "none";
      }
    });

    unpublishBtn.addEventListener("click", async () => {
      unpublishBtn.disabled = true;
      unpublishBtn.textContent = "Unpublishing...";
      const { error } = await supabaseClient.from("flies").update({ published: false }).eq("id", flyId);
      unpublishBtn.disabled = false;
      unpublishBtn.textContent = "Unpublish";

      if (error) {
        output.textContent = "Error unpublishing: " + error.message;
      } else {
        output.textContent = "Unpublished. This Fly is no longer visible on the public Feed.";
        currentPublished = false;
        unpublishBtn.style.display = "none";
        publishBtn.style.display = "inline-block";
        updateProgress();
      }
    });

    form.addEventListener("submit", async function (e) {
      e.preventDefault();
      imageLimitError.style.display = "none";

      const newFiles = pendingNewImages;
      const totalCount = currentImageUrls.length + newFiles.length;
      if (totalCount > 5) {
        imageLimitError.textContent = `That's ${totalCount} total photos. Max is 5. Remove some before saving.`;
        imageLimitError.style.display = "block";
        return;
      }

      saveBtn.disabled = true;
      saveBtn.textContent = "Saving...";

      const newImageFile = pendingClaimImage;
      let imagePath = currentImagePath;

      if (newImageFile) {
        const filePath = `${currentUserId}/${Date.now()}-${newImageFile.name}`;
        const { error: uploadError } = await supabaseClient.storage.from("evidence").upload(filePath, newImageFile);
        if (uploadError) {
          output.textContent = "Image upload failed: " + uploadError.message;
          saveBtn.disabled = false; saveBtn.textContent = "Save Changes";
          return;
        }
        if (currentImagePath) await supabaseClient.storage.from("evidence").remove([currentImagePath]);
        imagePath = filePath;
      }

      const uploadedUrls = [];
      for (const file of newFiles) {
        const filePath = `${currentUserId}/${Date.now()}-${file.name}`;
        const { error: uploadError } = await supabaseClient.storage.from("fly-images").upload(filePath, file);
        if (uploadError) {
          output.textContent = "Image upload failed: " + uploadError.message;
          saveBtn.disabled = false; saveBtn.textContent = "Save Changes";
          return;
        }
        const { data: publicUrlData } = supabaseClient.storage.from("fly-images").getPublicUrl(filePath);
        uploadedUrls.push(publicUrlData.publicUrl);
      }

      const finalImageUrls = [...currentImageUrls, ...uploadedUrls];

      const { error } = await supabaseClient
        .from("flies")
        .update({
          claim: claimText.value,
          description: descriptionText.value,
          evidence: evidenceText.value,
          full_story: fullStoryText.value,
          conclusion: conclusionText.value,
          impact: impactText.value,
          evidence_image_path: imagePath,
          image_urls: finalImageUrls,
        })
        .eq("id", flyId);

      saveBtn.disabled = false;
      saveBtn.textContent = "Save Changes";

      if (error) {
        output.textContent = "Error saving: " + error.message;
      } else {
        output.textContent = "Saved!";
        currentImagePath = imagePath;
        currentImageUrls = finalImageUrls;
        pendingNewImages = [];
        pendingClaimImage = null;
        claimImagePreview.innerHTML = "";
        isDirty = false;
        renderExistingImages();
        renderPendingImages();
      }
    });

    loadFly();
  </script>
</body>
</html>
