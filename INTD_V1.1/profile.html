<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>It's Not That Deep — My Profile</title>
  <link rel="stylesheet" href="styles.css?v=9" />
</head>
<body>

  <nav class="site-nav">
    <a href="index.html" class="site-logo">INTD</a>
    <div class="site-nav-links">
      <a href="index.html">Home</a>
      <a href="feed.html">Feed</a>
      <a href="profile.html" class="active">Profile</a>
    </div>
  </nav>

  <main class="feed-page">

    <!-- Identity -->
    <div class="profile-header-card">
      <button type="button" id="avatar-button" class="avatar-circle" aria-label="Change profile photo">
        <img id="avatar-img" alt="" hidden />
        <svg id="avatar-fallback" viewBox="0 0 24 24" width="28" height="28" fill="currentColor">
          <path d="M12 12c2.7 0 5-2.3 5-5s-2.3-5-5-5-5 2.3-5 5 2.3 5 5 5zm0 2c-3.3 0-10 1.7-10 5v3h20v-3c0-3.3-6.7-5-10-5z" />
        </svg>
      </button>

      <div class="profile-identity">
        <div id="display-name" class="profile-name">Loading user profile...</div>
        <div id="display-email" class="profile-email"></div>
      </div>

      <button type="button" id="edit-profile-btn" class="secondary-btn">Customize</button>
    </div>

    <input type="file" id="avatar-input" accept="image/*,.heic,.heif" hidden />

    <!-- Profile editor -->
    <section id="profile-editor" class="auth-card" hidden>
      <h2>Customize profile</h2>

      <div class="editor-row">
        <label for="display-name-input">Display name</label>
        <div class="editor-inline">
          <input type="text" id="display-name-input" maxlength="40" />
          <button type="button" id="save-name-btn">Save</button>
        </div>
        <p id="name-lock-note" class="auth-status-ok"></p>
      </div>

      <p id="profile-status" role="status" aria-live="polite"></p>
    </section>

    <header class="feed-header profile-list-header">
      <h2>My Flies</h2>
      <a href="edit.html" class="primary-btn">New Fly</a>
    </header>

    <section id="flies-list" class="recent-flies-grid"></section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="image-utils.js"></script>
  <script src="profile.js"></script>
</body>
</html>
