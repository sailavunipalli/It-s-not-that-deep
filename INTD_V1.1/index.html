<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>INTD — It's Not That Deep</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Site Navigation -->
  <header class="site-nav">
    <div class="nav-container" style="width: 100%; display: flex; justify-content: space-between; align-items: center; padding: 0 16px;">
      <a href="index.html" class="nav-brand">INTD</a>
      <nav class="nav-links">
        <a href="index.html" class="active">Home</a>
        <a href="create.html">+ Create Fly</a>
        <a href="profile.html">Profile</a>
      </nav>
    </div>
  </header>

  <!-- Main Feed Page -->
  <main class="feed-page">
    
    <!-- Feed Header -->
    <div class="feed-header">
      <span class="eyebrow">Structured Truth Platform</span>
      <h1>Public Feed</h1>
      <p class="feed-intro">Claims backed by evidence. Explore public cases or sign in to start your own.</p>
    </div>

    <!-- Dynamic Feed Container -->
    <div id="feed-container" class="recent-flies-grid">
      <!-- JavaScript will inject initial 3-4 flies here -->
    </div>

    <!-- Loading & End States -->
    <div id="feed-loader" class="feed-state" style="display: none;">
      <p>Loading more cases...</p>
    </div>

    <div id="feed-end" class="feed-state" style="display: none;">
      <p>🎉 You're all caught up! No more cases to load.</p>
    </div>

  </main>

  <script src="feed.js"></script>
</body>
</html>
